<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaikh Ziadul Haque | Official Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #111827; line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .site-header { background: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 20px 0; margin-bottom: 40px; }
        .site-header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo h1 { font-size: 1.25rem; font-weight: 700; color: #111827; }
        .logo p { font-size: 0.85rem; color: #6b7280; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #4b5563; font-weight: 500; font-size: 0.95rem; }
        .nav-links a:hover, .nav-links a.active { color: #2563eb; }
        .blog-intro { margin-bottom: 30px; }
        .blog-intro h2 { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
        .intro-desc { color: #4b5563; font-size: 1.1rem; max-width: 700px; }
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; margin-bottom: 60px; }
        .article-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; }
        .article-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .card-category { font-size: 0.75rem; font-weight: 600; color: #2563eb; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .article-card h4 { font-size: 1.2rem; font-weight: 700; color: #111827; margin-bottom: 10px; }
        .article-card p { font-size: 0.95rem; color: #4b5563; margin-bottom: 20px; }
        .card-link { display: inline-block; color: #2563eb; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        .card-link:hover { text-decoration: underline; }
        .site-footer { background: #ffffff; border-top: 1px solid #e5e7eb; padding: 30px 0; text-align: center; color: #6b7280; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="container">
            <div class="logo">
                <h1>Shaikh Ziadul Haque</h1>
                <p>Author & Creative Insights</p>
            </div>
            <nav class="nav-links">
                <a href="blog.html" class="active">Blog</a>
                <a href="https://www.amazon.com/stores/author/B0BDDHZ8X7/allbooks" target="_blank">Books</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <main class="main-content container">
        <section class="blog-intro">
            <h2>Insights & Ideas</h2>
            <p class="intro-desc">Thoughts on focus, mindfulness, drama, and digital life. Written for mindful readers.</p>
        </section>

        <section class="latest-section">
            <div class="articles-grid" id="postsContainer">
                <!-- Posts will be loaded dynamically from data.js -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Shaikh Ziadul Haque. All rights reserved.</p>
        </div>
    </footer>

    <!-- Load Data and Render Blog Cards -->
    <script src="data.js"></script>
    <script>
        const container = document.getElementById('postsContainer');
        
        sitePosts.forEach(post => {
            const card = document.createElement('article');
            card.className = 'article-card';
            card.innerHTML = `
                <div>
                    <span class="card-category">${post.category}</span>
                    <h4>${post.title}</h4>
                    <div style="font-size: 0.85rem; color: #6b7280; margin-bottom: 10px;">${post.date} • ${post.readTime}</div>
                    <p>${post.excerpt}</p>
                </div>
                <a href="reader.html?id=${post.id}" class="card-link">Read Full Work &rarr;</a>
            `;
            container.appendChild(card);
        });
    </script>

</body>
</html>
